services:
  postgres:
    image: postgres:16-alpine
    container_name: moovr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moovr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moovr"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
